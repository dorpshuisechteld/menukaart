<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menukaart Dorpshuis De Hoge Hof</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b2a44;
      color: #d8b45f;
      padding: 24px;
    }


    .kaart {
      max-width: 1000px;
      margin: 30px auto;
      padding: 38px;
      border: 2px solid #c79b45;
      border-radius: 24px;
      background: #0b2a44;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .kaart::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgba(199, 155, 69, 0.65);
      border-radius: 18px;
      pointer-events: none;
    }

    .kop,
    .sectie-titel,
    .menu-tabel,
    .voet {
      position: relative;
      z-index: 1;
    }

    .kop {
      text-align: center;
      margin-bottom: 34px;
    }

    h1 {
      margin: 0;
      font-size: 52px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #d8b45f;
    }

    .subtitel {
      margin-top: 14px;
      font-size: 20px;
      letter-spacing: 9px;
      text-transform: uppercase;
      color: #d8b45f;
    }

    .sectie-titel {
      display: flex;
      align-items: center;
      gap: 22px;
      margin: 36px 0 24px;
      font-size: 26px;
      letter-spacing: 12px;
      text-transform: uppercase;
      justify-content: center;
    }

    .sectie-titel::before,
    .sectie-titel::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #c79b45;
      max-width: 260px;
    }

    .menu-tabel {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 10px;
    }

    .menu-tabel th {
      text-align: left;
      font-size: 16px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #e7d09a;
      padding: 0 20px 4px;
    }

    .menu-tabel th:last-child {
      text-align: right;
    }

    .groep td {
      padding: 24px 20px 12px;
      color: #d8b45f;
      font-size: 26px;
      font-weight: normal;
      letter-spacing: 12px;
      text-transform: uppercase;
      text-align: center;
      border: none;
      background: transparent;
    }

    .menu-tabel tr.item td {
      padding: 13px 20px;
      border-top: 1px solid #c79b45;
      border-bottom: 1px solid #c79b45;
      background: rgba(4, 24, 42, 0.45);
    }

    .menu-tabel tr.item td:first-child {
      border-left: 1px solid #c79b45;
      border-radius: 14px 0 0 14px;
    }

    .menu-tabel tr.item td:last-child {
      width: 170px;
      border-right: 1px solid #c79b45;
      border-radius: 0 14px 14px 0;
      text-align: right;
      border-left: 2px dotted #c79b45;
    }

    .naam {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .bedrag {
      font-size: 24px;
      font-weight: bold;
    }

    .melding {
      padding: 18px 20px;
      border: 1px solid #c79b45;
      border-radius: 14px;
      color: #ffffff;
      background: rgba(4, 24, 42, 0.45);
      font-size: 18px;
    }

    .voet {
      text-align: center;
      margin-top: 34px;
      padding-top: 18px;
      font-size: 18px;
      letter-spacing: 7px;
      text-transform: uppercase;
      color: #d8b45f;
    }

    @media print {

      body {
        padding: 0;
      }

      .kaart {
        margin: 0 auto;
        box-shadow: none;
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .kaart {
        padding: 28px 16px;
      }

      h1 {
        font-size: 30px;
        letter-spacing: 2px;
      }

      .subtitel {
        font-size: 13px;
        letter-spacing: 4px;
      }

      .sectie-titel {
        font-size: 20px;
        letter-spacing: 7px;
      }

      .menu-tabel th {
        display: none;
      }

      .groep td {
        font-size: 18px;
        letter-spacing: 4px;
      }

      .menu-tabel tr.item td {
        padding: 12px;
      }

      .menu-tabel tr.item td:last-child {
        width: 95px;
      }

      .naam,
      .bedrag {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <main class="kaart">
    <header class="kop">
      <h1>Dorpshuis De Hoge Hof</h1>
      <div class="subtitel">Het hart van Echteld</div>
    </header>

    <div class="sectie-titel"></div>

    <table class="menu-tabel">
   
      <tbody id="menuBody"></tbody>
    </table>

    <footer class="voet">Bedankt & tot ziens!</footer>
  </main>

  <script>
    const menuBody = document.getElementById("menuBody");

    const volgordeTypes = [
      "Frisdrank",
      "Koffie, thee en warm",
      "Bier en alcoholvrij",
      "Wijn, port en mix",
      "Sterke drank",
      "Snacks, snoep en gebak",
      "Warme snacks en keuken",
      "Arrangementen en buffet",
      "Zaalhuur en diensten",
      "Munten en overig"
    ];

    function toonMelding(tekst) {
      menuBody.innerHTML = `<tr><td colspan="2"><div class="melding">${tekst}</div></td></tr>`;
    }

    function splitCsvRegel(regel) {
      const resultaat = [];
      let waarde = "";
      let inQuotes = false;

      for (let i = 0; i < regel.length; i++) {
        const teken = regel[i];

        if (teken === '"') {
          inQuotes = !inQuotes;
        } else if ((teken === ";" || teken === "\t") && !inQuotes) {
          resultaat.push(waarde.trim());
          waarde = "";
        } else {
          waarde += teken;
        }
      }

      resultaat.push(waarde.trim());
      return resultaat;
    }

    function leesCsv(csvTekst) {
      const regels = csvTekst
        .split(/\r?\n/)
        .map(regel => regel.trim())
        .filter(regel => regel.length > 0);

      const items = [];

      regels.forEach((regel, index) => {
        const delen = splitCsvRegel(regel);

        if (index === 0 && delen.join(";").toLowerCase().includes("naam")) {
          return;
        }

        if (delen.length >= 3) {
          items.push({
            type: delen[0],
            naam: delen[1],
            bedrag: delen[2]
          });
        }
      });

      return items;
    }

    function sorteerItems(items) {
      return items.sort((a, b) => {
        const indexA = volgordeTypes.indexOf(a.type);
        const indexB = volgordeTypes.indexOf(b.type);
        const volgordeA = indexA === -1 ? 999 : indexA;
        const volgordeB = indexB === -1 ? 999 : indexB;

        if (volgordeA !== volgordeB) {
          return volgordeA - volgordeB;
        }

        if (a.type !== b.type) {
          return a.type.localeCompare(b.type, "nl");
        }

        return a.naam.localeCompare(b.naam, "nl");
      });
    }

    function toonMenu(items) {
      if (items.length === 0) {
        toonMelding("Geen producten gevonden in de CSV.");
        return;
      }

      menuBody.innerHTML = "";
      let laatsteType = "";

      sorteerItems(items).forEach(item => {
        if (item.type !== laatsteType) {
          const groepRij = document.createElement("tr");
          groepRij.className = "groep";
          groepRij.innerHTML = `<td colspan="2">${item.type}</td>`;
          menuBody.appendChild(groepRij);
          laatsteType = item.type;
        }

        const rij = document.createElement("tr");
        rij.className = "item";
        rij.innerHTML = `
          <td class="naam">${item.naam}</td>
          <td class="bedrag">${item.bedrag}</td>
        `;
        menuBody.appendChild(rij);
      });
    }

    function laadCsvTekst(csvTekst) {
      toonMenu(leesCsv(csvTekst));
    }

    fetch("menukaart.csv")
      .then(response => {
        if (!response.ok) {
          throw new Error("CSV niet gevonden");
        }
        return response.text();
      })
      .then(laadCsvTekst)
      .catch(() => {
        toonMelding("Kan menukaart.csv niet laden. Zet menukaart.html en menukaart.csv in dezelfde map en open via een lokale server of website.");
      });
  </script>
</body>
</html>
